name: CI

on:
  push:
    branches:
      - main
      - feat/audio-analysis-engine
      - feat/ai-story-director
      - feat/blender-vertical-slice
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check apps/production/src/cli.js
          node --check packages/audio-analysis/src/index.js
          node --check packages/story/src/index.js
          node --check tests/audio-analysis.test.js
          node --check tests/story-director.test.js
      - name: Check Blender pipeline Python syntax
        run: python -m py_compile blender/scripts/vertical_slice.py blender/scripts/render_pilot.py
      - name: Test render orchestration
        run: python -m unittest tests/test_render_pilot.py
      - name: Run Node tests
        run: npm test
      - name: Validate pilot project
        run: npm run validate
