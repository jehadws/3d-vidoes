name: CI

on:
  push:
    branches:
      - main
      - feat/audio-analysis-engine
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check apps/production/src/cli.js
          node --check packages/audio-analysis/src/index.js
          node --check tests/audio-analysis.test.js
      - name: Run tests
        run: npm test
      - name: Validate pilot project
        run: npm run validate
